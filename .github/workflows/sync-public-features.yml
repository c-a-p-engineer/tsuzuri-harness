name: Sync Public Feature Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/features.json'
      - 'function/**'
      - 'scripts/sync-public-features.py'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/features.json'
      - 'function/**'
      - 'scripts/sync-public-features.py'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated public feature surfaces
        run: python3 scripts/sync-public-features.py --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Synchronize public feature surfaces
        run: python3 scripts/sync-public-features.py --write
      - name: Verify synchronized output
        run: python3 scripts/sync-public-features.py --check
      - name: Commit generated documentation when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Public feature documentation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.ja.md docs/FEATURES.md docs/FEATURES.ja.md site/index.html site/ja/index.html CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md
          git commit -m 'docs: sync public feature surfaces'
          git push origin HEAD:master
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy updated Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
