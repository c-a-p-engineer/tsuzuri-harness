name: Validate Public Capability Docs

on:
  push:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'function/**'
      - 'docs/CAPABILITIES.md'
      - 'docs/CAPABILITIES.ja.md'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  pull_request:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'function/**'
      - 'docs/CAPABILITIES.md'
      - 'docs/CAPABILITIES.ja.md'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate capability inventory and discovery links
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/CAPABILITIES.md
          test -f docs/CAPABILITIES.ja.md

          for capability in \
            'Identity Formation' \
            'Relationship Lifecycle' \
            'Retention Routing' \
            'Memory Record Lifecycle' \
            'Memory Metabolism' \
            'Memory Retrieval' \
            'Capability Library Health' \
            'External Skill Provenance' \
            'Self-Evolution' \
            'Evolution Traceability' \
            'Harness Complexity Budget' \
            'Task Contract' \
            'Contextual Activation' \
            'Governance' \
            'Execution Provenance' \
            'CORE View' \
            'JOURNEY Album' \
            'Host Portability' \
            'Regression Evaluation'; do
            grep -Fq "$capability" docs/CAPABILITIES.md || {
              echo "English capability inventory is missing: $capability" >&2
              exit 1
            }
            grep -Fq "$capability" docs/CAPABILITIES.ja.md || {
              echo "Japanese capability inventory is missing: $capability" >&2
              exit 1
            }
          done

          grep -Fq 'docs/CAPABILITIES.md' README.md
          grep -Fq 'docs/CAPABILITIES.ja.md' README.ja.md
          grep -Fq 'docs/CAPABILITIES.md' site/index.html
          grep -Fq 'docs/CAPABILITIES.ja.md' site/ja/index.html
          grep -Fq 'docs/CAPABILITIES.md' CONTRIBUTING.md
          grep -Fq 'docs/CAPABILITIES.md' .github/PULL_REQUEST_TEMPLATE.md

      - name: Require inventory review for top-level function contract shape changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo 'Manual run: diff guard skipped.'
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'No comparable base commit; diff guard skipped.'
            exit 0
          fi

          contract_changes="$(git diff --name-status "$base" "$head" -- 'function/*.md' 'function/*.schema.yaml' | awk '$1 ~ /^(A|D|R)/ { print }')"
          if [[ -z "$contract_changes" ]]; then
            echo 'No added/deleted/renamed top-level function contracts.'
            exit 0
          fi

          echo 'Top-level function contract surface changed:'
          printf '%s\n' "$contract_changes"

          changed_docs="$(git diff --name-only "$base" "$head" -- docs/CAPABILITIES.md docs/CAPABILITIES.ja.md)"
          printf '%s\n' "$changed_docs" | grep -Fxq 'docs/CAPABILITIES.md' || {
            echo 'Review/update docs/CAPABILITIES.md in the same change.' >&2
            exit 1
          }
          printf '%s\n' "$changed_docs" | grep -Fxq 'docs/CAPABILITIES.ja.md' || {
            echo 'Review/update docs/CAPABILITIES.ja.md in the same change.' >&2
            exit 1
          }

      - name: Validate maintenance rule is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public capability surface changes' CONTRIBUTING.md
          grep -Fq 'Public capability surface' .github/PULL_REQUEST_TEMPLATE.md
          grep -Fq 'no_public_doc_change' docs/CAPABILITIES.md
          grep -Fq 'no_public_doc_change' docs/CAPABILITIES.ja.md
