name: Sync Public Feature Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/features.json'
      - 'function/**'
      - 'scripts/sync-public-features.py'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/features.json'
      - 'function/**'
      - 'scripts/sync-public-features.py'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  catalog_guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require catalog review for public function-contract additions/removals/renames
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo 'Manual run: catalog diff guard skipped.'
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'No comparable base commit; catalog diff guard skipped.'
            exit 0
          fi

          contract_changes="$(git diff --name-status "$base" "$head" -- 'function/*.md' 'function/*.schema.yaml' | awk '$1 ~ /^(A|D|R)/ { print }')"
          if [[ -z "$contract_changes" ]]; then
            echo 'No added/deleted/renamed top-level function contracts.'
            exit 0
          fi

          echo 'Public function-contract shape changed:'
          printf '%s\n' "$contract_changes"

          if ! git diff --name-only "$base" "$head" -- docs/features.json | grep -Fxq 'docs/features.json'; then
            echo 'docs/features.json was not updated.' >&2
            echo 'Review the public capability catalog, update it when the public surface changed, then run:' >&2
            echo '  python3 scripts/sync-public-features.py --write' >&2
            echo '  python3 scripts/sync-public-features.py --check' >&2
            exit 1
          fi

          echo 'Public feature catalog was reviewed in the same change.'

  check:
    if: github.event_name == 'pull_request'
    needs: catalog_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated public feature surfaces
        run: python3 scripts/sync-public-features.py --check

  sync:
    if: github.event_name != 'pull_request'
    needs: catalog_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Synchronize public feature surfaces
        run: python3 scripts/sync-public-features.py --write
      - name: Verify synchronized output
        run: python3 scripts/sync-public-features.py --check
      - name: Commit generated documentation when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Public feature documentation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.ja.md docs/FEATURES.md docs/FEATURES.ja.md site/index.html site/ja/index.html CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md
          git commit -m 'docs: sync public feature surfaces'
          git push origin HEAD:master
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy updated Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
