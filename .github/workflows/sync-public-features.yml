name: Validate Public Capability Docs

on:
  push:
    branches: [master]
    paths:
      - 'function/**'
      - 'docs/CAPABILITIES.md'
      - 'docs/CAPABILITIES.ja.md'
      - 'docs/DOCUMENTATION-SYNC.md'
      - 'docs/DOCUMENTATION-SYNC.ja.md'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  pull_request:
    branches: [master]
    paths:
      - 'function/**'
      - 'docs/CAPABILITIES.md'
      - 'docs/CAPABILITIES.ja.md'
      - 'docs/DOCUMENTATION-SYNC.md'
      - 'docs/DOCUMENTATION-SYNC.ja.md'
      - 'README.md'
      - 'README.ja.md'
      - 'site/index.html'
      - 'site/ja/index.html'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/sync-public-features.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate capability inventory surfaces
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            docs/CAPABILITIES.md docs/CAPABILITIES.ja.md \
            docs/DOCUMENTATION-SYNC.md docs/DOCUMENTATION-SYNC.ja.md; do
            test -f "$f" || { echo "Missing public capability document: $f" >&2; exit 1; }
          done

          for capability in \
            'Memory Retrieval' \
            'Memory Record' \
            'Capability Library Health' \
            'External Skill Provenance' \
            'Execution Provenance' \
            'Harness Complexity Budget' \
            'Evolution Traceability' \
            'Host Portability'; do
            grep -Fq "$capability" docs/CAPABILITIES.md || { echo "Canonical capability inventory is missing: $capability" >&2; exit 1; }
            grep -Fq "$capability" docs/CAPABILITIES.ja.md || { echo "Japanese capability inventory is missing: $capability" >&2; exit 1; }
          done

          grep -Fq 'docs/CAPABILITIES.md' README.md
          grep -Fq 'docs/CAPABILITIES.ja.md' README.ja.md
          grep -Fq 'docs/CAPABILITIES.md' site/index.html
          grep -Fq 'docs/CAPABILITIES.ja.md' site/ja/index.html
          grep -Fq 'docs/DOCUMENTATION-SYNC.md' CONTRIBUTING.md
          grep -Fq 'docs/DOCUMENTATION-SYNC.md' .github/PULL_REQUEST_TEMPLATE.md

      - name: Require inventory review for top-level function surface changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          changes="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- 'function/*.md' 'function/*.schema.yaml')"
          if ! printf '%s\n' "$changes" | awk '$1 ~ /^(A|D|R)/ { found=1 } END { exit(found ? 0 : 1) }'; then
            echo 'No added/deleted/renamed top-level function contract.'
            exit 0
          fi

          echo 'Top-level function contract surface changed:'
          printf '%s\n' "$changes"

          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$changed_files" | grep -Fxq 'docs/CAPABILITIES.md' || {
            echo 'Top-level function surface changed without reviewing docs/CAPABILITIES.md.' >&2
            exit 1
          }
          printf '%s\n' "$changed_files" | grep -Fxq 'docs/CAPABILITIES.ja.md' || {
            echo 'Top-level function surface changed without reviewing docs/CAPABILITIES.ja.md.' >&2
            exit 1
          }

      - name: Documentation synchronization policy is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'no_public_doc_change' docs/DOCUMENTATION-SYNC.md
          grep -Fq 'README.md' docs/DOCUMENTATION-SYNC.md
          grep -Fq 'site/index.html' docs/DOCUMENTATION-SYNC.md
          grep -Fq 'Regression' docs/DOCUMENTATION-SYNC.ja.md
