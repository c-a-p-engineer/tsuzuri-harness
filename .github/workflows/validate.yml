name: Validate Harness

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            AGENTS.md README.md LICENSE NOTICE BRANDING.md CONTRIBUTING.md SECURITY.md \
            function/runtime.md function/retention-routing.md function/capability-maintenance.md \
            function/self-evolution.md function/runtime-workspace.md function/skills/index.yaml \
            templates/instance/identity/state.yaml templates/instance/relationship/state.yaml \
            templates/instance/memory/index.yaml scripts/init-instance.sh scripts/init-instance.ps1 \
            scripts/backup-instance.sh scripts/backup-instance.ps1 docs/INSTANCE-SETUP.md \
            docs/COMPATIBILITY.md docs/MIGRATION.md docs/PROJECT-POLICY.md docs/WHY-TSUZURI.md \
            .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md .github/workflows/pages.yml \
            site/index.html site/styles.css; do
            test -f "$f" || { echo "Missing required file: $f" >&2; exit 1; }
          done

      - name: Validate blank starter state
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name: null$' templates/instance/identity/state.yaml
          grep -Eq '^role: null$' templates/instance/identity/state.yaml
          grep -Eq '^values: \[\]$' templates/instance/identity/state.yaml
          grep -Eq '^preferences: \[\]$' templates/instance/identity/state.yaml
          grep -Eq '^memories: \[\]$' templates/instance/memory/index.yaml
          grep -Eq '^acquired_skills: \[\]$' function/skills/index.yaml

      - name: Smoke-test POSIX instance initialization
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          bash scripts/init-instance.sh
          test -f identity/state.yaml
          test -f relationship/state.yaml
          test -f memory/index.yaml
          test -f .tsuzuri-instance.yaml
          grep -Eq '^name: null$' identity/state.yaml
          grep -Eq '^memories: \[\]$' memory/index.yaml
          grep -Eq '^mode: instance$' .tsuzuri-instance.yaml
          bash scripts/backup-instance.sh
          find .runtime/backups -mindepth 1 -maxdepth 1 -type d | grep -q .

      - name: Validate issue forms and site
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '^ndescription:' .github/ISSUE_TEMPLATE
          for locale in ja zh-cn zh-tw ko es; do test -f "site/$locale/index.html"; done
          grep -q 'Create a blank AI' site/index.html
          grep -q 'Apache-2.0' site/index.html

      - name: Validate no transient runtime state is tracked
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '.runtime/' .gitignore
          if git ls-files '.runtime/**' | grep -q .; then
            echo 'Tracked .runtime state is not allowed.' >&2
            exit 1
          fi
