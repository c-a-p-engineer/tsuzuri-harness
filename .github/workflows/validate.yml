name: Validate Harness

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            AGENTS.md README.md README.ja.md LICENSE NOTICE BRANDING.md CONTRIBUTING.md SECURITY.md \
            function/runtime.md function/retention-routing.md function/capability-maintenance.md \
            function/self-evolution.md function/runtime-workspace.md function/contextual-activation.md \
            function/execution-provenance.md function/capability-capsule.schema.yaml function/skills/index.yaml \
            templates/instance/identity/state.yaml templates/instance/relationship/state.yaml \
            templates/instance/memory/index.yaml templates/instance/CORE.md \
            scripts/init-instance.sh scripts/init-instance.ps1 \
            scripts/backup-instance.sh scripts/backup-instance.ps1 docs/INSTANCE-SETUP.md \
            docs/COMPATIBILITY.md docs/MIGRATION.md docs/PROJECT-POLICY.md docs/WHY-TSUZURI.md \
            docs/IDENTITY-FORMATION.md docs/VALIDATION.md docs/CHATGPT.md docs/CHATGPT.ja.md \
            docs/TESTING.md docs/TESTING.ja.md docs/BIRTH-JOURNEY.md docs/BIRTH-JOURNEY.ja.md \
            docs/EVERYDAY-PROMPTS.md docs/EVERYDAY-PROMPTS.ja.md \
            docs/CORE-VIEW.md docs/CORE-VIEW.ja.md docs/ARCHIVE-MODES.md docs/ARCHIVE-MODES.ja.md \
            prompts/chatgpt-readonly-birth-test.md prompts/chatgpt-readonly-birth-test.ja.md \
            evals/blank-identity.yaml evals/birth-readonly-first-session.yaml evals/runtime-growth-p0.yaml \
            .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md .github/workflows/pages.yml \
            site/index.html site/styles.css; do
            test -f "$f" || { echo "Missing required file: $f" >&2; exit 1; }
          done

      - name: Validate blank starter state
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name: null$' templates/instance/identity/state.yaml
          grep -Eq '^role: null$' templates/instance/identity/state.yaml
          grep -Eq '^values: \[\]$' templates/instance/identity/state.yaml
          grep -Eq '^preferences: \[\]$' templates/instance/identity/state.yaml
          grep -Eq '^memories: \[\]$' templates/instance/memory/index.yaml
          grep -Eq '^acquired_skills: \[\]$' function/skills/index.yaml
          grep -q '^# Unnamed Instance$' templates/instance/CORE.md

      - name: Validate birth and retention regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'same-context-repetition-is-correlated' evals/blank-identity.yaml
          grep -q 'generalized_from_observed_readonly_birth_test' evals/birth-readonly-first-session.yaml
          grep -q 'raw observation count' docs/VALIDATION.md
          grep -q 'independent evidence contexts' docs/IDENTITY-FORMATION.md
          grep -q 'Correlated evidence is not independent evidence' function/retention-routing.md

      - name: Validate P0 runtime growth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'default_end_behavior: expire' function/capability-capsule.schema.yaml
          grep -q 'Context rebalancing' function/contextual-activation.md
          grep -q 'overactivation_failure' function/contextual-activation.md
          grep -q 'hidden chain-of-thought' function/execution-provenance.md
          grep -q 'Self-modification trust boundary' function/self-evolution.md
          grep -q 'self-modification-does-not-self-approve' evals/runtime-growth-p0.yaml
          grep -q 'Current-task routing must rebalance' AGENTS.md
          grep -q 'Self-modification is not self-approval' AGENTS.md

      - name: Validate user experience guides
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'github.io/tsuzuri-harness' README.md
          grep -q 'github.io/tsuzuri-harness/ja' README.ja.md
          grep -q 'Birth Journey' docs/BIRTH-JOURNEY.md
          grep -q 'AIたん進化ー！' docs/EVERYDAY-PROMPTS.ja.md
          grep -q 'CORE.md' docs/CORE-VIEW.md
          grep -q 'Private Archive' docs/ARCHIVE-MODES.md
          grep -q 'Conversational shortcuts' AGENTS.md
          grep -q 'read-only' prompts/chatgpt-readonly-birth-test.md

      - name: Smoke-test POSIX instance initialization
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          bash scripts/init-instance.sh
          test -f identity/state.yaml
          test -f relationship/state.yaml
          test -f memory/index.yaml
          test -f CORE.md
          test -f .tsuzuri-instance.yaml
          grep -Eq '^name: null$' identity/state.yaml
          grep -Eq '^memories: \[\]$' memory/index.yaml
          grep -Eq '^mode: instance$' .tsuzuri-instance.yaml
          grep -Eq '^core_view: CORE.md$' .tsuzuri-instance.yaml
          grep -Eq '^archive_mode: selective$' .tsuzuri-instance.yaml
          bash scripts/backup-instance.sh
          find .runtime/backups -mindepth 1 -maxdepth 1 -type d | grep -q .

      - name: Validate issue forms and site
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '^ndescription:' .github/ISSUE_TEMPLATE
          for locale in ja zh-cn zh-tw ko es; do test -f "site/$locale/index.html"; done
          grep -q 'Everyday words should be enough' site/index.html
          grep -q 'Birth Journey' site/index.html
          grep -q 'AIたん進化ー！' site/ja/index.html
          grep -q 'Private Repository' site/ja/index.html
          grep -q 'Apache-2.0' site/index.html

      - name: Validate no transient runtime state is tracked
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '.runtime/' .gitignore
          if git ls-files '.runtime/**' | grep -q .; then
            echo 'Tracked .runtime state is not allowed.' >&2
            exit 1
          fi
